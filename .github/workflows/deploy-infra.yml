name: Deploy Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # necesario para OIDC
  contents: read

jobs:
  terraform-apply:
    name: Terraform deploy
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ secrets.STATE_KEY || 'aws-instances-bot/terraform.tfstate' }}
      TF_STATE_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE || 'aws-instances-bot-locks' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::336425345125:role/github-actions-aws-instances-bot
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        run: terraform init \
          -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ env.TF_STATE_KEY }}" \
          -backend-config="region=${{ env.TF_STATE_REGION }}" \
          -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
